# Cadence on one machine: Postgres, migrations, the web app, the worker, Caddy (HTTPS) and a nightly backup.
# Run from the repo root on the server: docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
name: cadence
# web, worker and migrate run the same image. Only web builds it: with `build` on all three, compose builds
# and exports the image three times at once, which filled the server's disk on 2026-10-02.
x-app: &app
  image: cadence-app
  env_file: [{ path: .env, required: false }]
  environment:
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/cadence
  restart: unless-stopped
services:
  db:
    image: postgres:17
    environment: { POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: cadence }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "postgres"], interval: 5s, retries: 20 }
    restart: unless-stopped
  migrate:
    <<: *app
    pull_policy: never # built by web, never on a registry
    command: ["pnpm", "db:migrate"]
    restart: "no"
    depends_on: { db: { condition: service_healthy } }
  web:
    <<: *app
    build: { context: .., args: { SITE_URL: "${BETTER_AUTH_URL}" } }
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    <<: *app
    pull_policy: never # built by web, never on a registry
    command: ["node", "dist/worker.mjs"]
    restart: always
    depends_on: { migrate: { condition: service_completed_successfully } }
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment: { DOMAIN: "${DOMAIN}" }
    volumes: [./Caddyfile:/etc/caddy/Caddyfile:ro, caddy:/data]
    depends_on: [web]
    restart: unless-stopped
  backup:
    image: postgres:17
    environment: { PGPASSWORD: "${POSTGRES_PASSWORD}" }
    volumes: [./backups:/backups]
    # Nightly dump, keep 14 days.
    entrypoint: ["sh", "-c", "while true; do pg_dump -h db -U postgres -Fc cadence > /backups/cadence-$$(date +%F).dump && find /backups -name '*.dump' -mtime +14 -delete; sleep 86400; done"]
    depends_on: { db: { condition: service_healthy } }
    restart: unless-stopped
volumes: { pgdata: {}, caddy: {} }
