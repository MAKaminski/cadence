name: Feature request
description: A setting, routine or check you'd like Cadence to have
labels: [enhancement]
body:
  - type: markdown
    attributes: { value: "Tip: bigger ideas get more votes in [Discussions → Ideas](https://github.com/MAKaminski/cadence/discussions/categories/ideas). See what exists today at /how-it-works." }
  - type: textarea
    id: problem
    attributes: { label: What are you trying to do?, description: "The outcome, not the button." }
    validations: { required: true }
  - type: dropdown
    id: kind
    attributes: { label: What kind of change, options: [A new setting, A new automatic routine, A new check on drafts, A change to how drafts are adjusted, Something else] }
  - type: textarea
    id: idea
    attributes: { label: How you imagine it working }
