name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_PASSWORD: dev, POSTGRES_DB: cadence }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:dev@localhost:5432/cadence
      TEST_DATABASE_URL: postgres://postgres:dev@localhost:5432/cadence
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      LINKEDIN_CLIENT_ID: ci
      LINKEDIN_CLIENT_SECRET: ci
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      STRIPE_PRICE_ID: price_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm scrub
      - run: pnpm arch:check
      - run: pnpm catalog:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:worker
      # The whole product end to end in demo mode: sign-up, trial, setup, check-in, drafts, approve, publish.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Demo smoke test
        run: |
          pnpm demo --prod > demo.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          pnpm test:e2e || { tail -100 demo.log; exit 1; }
