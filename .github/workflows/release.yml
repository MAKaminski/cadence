name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG section for $v"; exit 1; }
      - name: Create or update the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then gh release edit "$GITHUB_REF_NAME" --notes-file notes.md;
          else gh release create "$GITHUB_REF_NAME" --title "Cadence $GITHUB_REF_NAME" --notes-file notes.md; fi
          if [ -f public/demo/cadence-demo.mp4 ]; then gh release upload "$GITHUB_REF_NAME" public/demo/cadence-demo.mp4 --clobber; fi
